---
layout: default
---
<main class="post">
  <div class="post-meta">
    <a class="back-link" href="{{ '/' | relative_url }}">← back</a>
    <span class="tag">{{ page.tag }}</span>
  </div>
  <h1>{{ page.title }}</h1>
  {{ content }}
  {% if page.link_url %}
    <a class="card-link" href="{{ page.link_url }}" target="_blank" rel="noopener">{{ page.link_label | default: "link" }} →</a>
  {% endif %}
</main>
