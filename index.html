---
layout: default
---
<main class="grid">
{% assign projects = site.projects | sort: "order" %}
{% for project in projects %}
  <a class="card" href="{{ project.url | relative_url }}">
    <span class="tag">{{ project.tag }}</span>
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
    <div class="photos">
      <div class="thumb"></div>
      <div class="thumb"></div>
      <div class="thumb"></div>
    </div>
    <span class="card-link">{{ project.link_label | default: "details" }} →</span>
  </a>
{% endfor %}
</main>
